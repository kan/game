name: CI

# 型の検査、整形の検査（Prettier）、テスト（@cloudflare/vitest-plugin。Workers のランタイム上で、
# ローカルの D1 に対して実行）を回す。Dependabot の npm の PR もここを通る。デプロイ
# （deploy:dev / deploy:production）は CI に入れず、手元で行う。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test

  # scripts/tagpr/（kan/tagpr-scripts の git subtree）と、tagpr.yml / tagpr-label.yml が呼ぶ
  # tagpr-scripts の commit が一致するかを見る。subtree pull で行を上げ忘れた、行だけを
  # 上げた、scripts/tagpr/ を手で編集した、のどれでも落ちる。詳細は tagpr-scripts の README
  # 「The tagpr workflow」。
  tagpr-subtree:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # tagpr-scripts のテストと postVersionCommand と同じ 24 に揃える。
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: scripts/tagpr/ が tagpr workflow の SHA と一致するか
        run: node scripts/tagpr/verify-subtree.mjs
