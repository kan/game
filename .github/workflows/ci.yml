name: CI

# 型の検査、整形の検査（Prettier）、テスト（@cloudflare/vitest-plugin。Workers のランタイム上で、
# ローカルの D1 に対して実行）を回す。Dependabot の npm の PR もここを通る。デプロイ
# （deploy:dev / deploy:production）は CI に入れず、手元で行う。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
